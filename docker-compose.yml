# =============================================================================
# PMG Group OS — full local stack
# =============================================================================
# One command brings up the whole app (it builds automatically on first run):
#
#   docker compose up -d --build       (or just: ./run.ps1)
#
# Then open  http://localhost:3200  and log in with:
#   shershah_nawabi@pmggroup-llc.com  /  PMGAdmin2024!   (auto-seeded on boot)
#
# Services:
#   postgres  — PostgreSQL with a persistent named volume (reuses your existing
#               `pgdata` volume, so previously-seeded demo data is preserved)
#   migrate   — one-shot: pushes the Drizzle schema, then exits (safe on both a
#               fresh and an already-populated DB — see its comment below)
#   api       — Express API (internal :8080, not published)
#   web       — nginx serving the React build + proxying /api → api  (:3200)
#
# ZERO CONFIG: every var below has a local default, so the stack boots with no
# `.env` file. AI runs in dummy mode by default (canned responses, no cost, no
# key). To use REAL AI, create a `.env` next to this file with
# AI_DUMMY_MODE=false and your AI_INTEGRATIONS_OPENAI_* values — Compose
# auto-loads it and overrides the `${VAR:-default}` placeholders.
# -----------------------------------------------------------------------------
services:
  postgres:
    image: postgres:latest
    container_name: pmg-os-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: pmg_user
      POSTGRES_PASSWORD: pmg_secret
      POSTGRES_DB: pmg_os
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      # host:container — exposes the DB to host tools (psql, GUIs). The app
      # containers reach it over the compose network at postgres:5432.
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pmg_user -d pmg_os"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  # One-shot schema push. Reuses the unified `base` stage (full workspace +
  # node_modules + drizzle-kit). stdin is closed (`< /dev/null`) so that on an
  # already-populated DB drizzle-kit's destructive-change prompt gets EOF and
  # aborts that change instead of hanging or dropping data; `|| true` keeps the
  # stack coming up regardless. On a FRESH DB it creates every table cleanly.
  migrate:
    build:
      context: .
      dockerfile: Dockerfile
      target: base
    image: pmg-os-migrate
    command: ["sh", "-c", "pnpm --filter @workspace/db run push < /dev/null || true"]
    environment:
      DATABASE_URL: postgres://pmg_user:pmg_secret@postgres:5432/pmg_os
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: api
    image: pmg-os-api
    container_name: pmg-os-api
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: "8080"
      DATABASE_URL: postgres://pmg_user:pmg_secret@postgres:5432/pmg_os
      SESSION_SECRET: ${SESSION_SECRET:-pmg-os-dev-secret-change-in-production}
      # AI runs in dummy mode by default → the app works with no keys and no
      # cost. Set AI_DUMMY_MODE=false + a real key in `.env` to enable live AI.
      AI_DUMMY_MODE: ${AI_DUMMY_MODE:-true}
      AI_INTEGRATIONS_OPENAI_BASE_URL: ${AI_INTEGRATIONS_OPENAI_BASE_URL:-https://api.openai.com/v1}
      AI_INTEGRATIONS_OPENAI_API_KEY: ${AI_INTEGRATIONS_OPENAI_API_KEY:-placeholder-set-a-real-key-and-AI_DUMMY_MODE=false-to-enable-ai}
      # Apollo lead-gen monthly credit cap (matches your Apollo plan; default 2500).
      APOLLO_MONTHLY_CREDIT_CAP: ${APOLLO_MONTHLY_CREDIT_CAP:-2500}
      # Async Apollo MOBILE reveal. Leave blank for sync-only phone capture. To
      # receive freshly-revealed mobiles, set these in `.env` to a PUBLIC URL that
      # reaches this API's POST /api/apollo/phone-webhook (ngrok/cloudflared in dev,
      # your real host in prod). Apollo cannot reach localhost.
      APOLLO_WEBHOOK_URL: ${APOLLO_WEBHOOK_URL:-}
      APOLLO_WEBHOOK_SECRET: ${APOLLO_WEBHOOK_SECRET:-}
      # --- Social Command inbound (Phase 1 + WhatsApp) ---------------------
      # All blank by default → the webhook receivers stay inert until you set
      # these. Point Meta/WhatsApp webhooks at a PUBLIC URL reaching this API
      # (ngrok/cloudflared in dev, your host in prod) — Meta cannot reach localhost.
      #   Meta Graph (Facebook Page / Lead Ads; Messenger+IG later):
      META_APP_SECRET: ${META_APP_SECRET:-}
      META_VERIFY_TOKEN: ${META_VERIFY_TOKEN:-}
      META_PAGE_ACCESS_TOKEN: ${META_PAGE_ACCESS_TOKEN:-}
      META_GRAPH_VERSION: ${META_GRAPH_VERSION:-v21.0}
      #   WhatsApp Cloud API (inbound needs verify+app secret; outbound needs token+phone id):
      WHATSAPP_APP_SECRET: ${WHATSAPP_APP_SECRET:-}
      WHATSAPP_VERIFY_TOKEN: ${WHATSAPP_VERIFY_TOKEN:-}
      WHATSAPP_ACCESS_TOKEN: ${WHATSAPP_ACCESS_TOKEN:-}
      WHATSAPP_PHONE_NUMBER_ID: ${WHATSAPP_PHONE_NUMBER_ID:-}
      WHATSAPP_GRAPH_VERSION: ${WHATSAPP_GRAPH_VERSION:-}
      #   First-party website form (optional shared secret guarding ?secret=):
      WEBSITE_FORM_SECRET: ${WEBSITE_FORM_SECRET:-}
    expose:
      - "8080"
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      # node:slim has no curl/wget; use Node's global fetch against /api/healthz.
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:8080/api/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  web:
    build:
      context: .
      dockerfile: Dockerfile
      target: web
    image: pmg-os-web
    container_name: pmg-os-web
    restart: unless-stopped
    ports:
      # The app is reachable at http://localhost:3200
      - "3200:80"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  # Unnamed (project-scoped) on purpose: this is the SAME volume your previous
  # DB-only compose used, so existing seeded data is preserved.
  pgdata:
