services:
  postgres:
    image: postgres:latest
    container_name: pmg-os-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: pmg_user
      POSTGRES_PASSWORD: pmg_secret
      POSTGRES_DB: pmg_os
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql

volumes:
  pgdata:
