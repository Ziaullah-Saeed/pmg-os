components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
        timestamp:
          type: string
          format: date-time
        uptime:
          type: number
        database:
          type: string
      required:
        - status
        - timestamp

    DashboardSummary:
      type: object
      properties:
        totalCompanies:
          type: integer
        totalContacts:
          type: integer
        totalLeads:
          type: integer
        totalOpportunities:
          type: integer
        totalActivities:
          type: integer
        totalCampaigns:
          type: integer
        totalTasks:
          type: integer
        pipelineValue:
          type: number
        monthlyRevenue:
          type: array
          items:
            type: object
            properties:
              month:
                type: string
              value:
                type: number
            required:
              - month
              - value
      required:
        - totalCompanies
        - totalContacts
        - totalLeads
        - totalOpportunities
        - totalActivities
        - totalCampaigns
        - totalTasks
        - pipelineValue

    PipelineSummary:
      type: object
      properties:
        stages:
          type: array
          items:
            $ref: "#/components/schemas/PipelineStage"
        totalValue:
          type: number
        totalDeals:
          type: integer
      required:
        - stages
        - totalValue
        - totalDeals

    PipelineStage:
      type: object
      properties:
        name:
          type: string
        count:
          type: integer
        value:
          type: number
        percentage:
          type: number
      required:
        - name
        - count
        - value
        - percentage

    Company:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        industry:
          type: string
        subIndustry:
          type: ["string", "null"]
        website:
          type: ["string", "null"]
        size:
          type: ["string", "null"]
        revenue:
          type: ["string", "null"]
        location:
          type: ["string", "null"]
        status:
          type: string
        fitScore:
          type: ["integer", "null"]
        painPoints:
          type: ["string", "null"]
        notes:
          type: ["string", "null"]
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
        - id
        - name
        - industry
        - status
        - createdAt
        - updatedAt

    CreateCompanyBody:
      type: object
      properties:
        name:
          type: string
        industry:
          type: string
        subIndustry:
          type: string
        website:
          type: string
        size:
          type: string
        revenue:
          type: string
        location:
          type: string
        status:
          type: string
        fitScore:
          type: integer
        painPoints:
          type: string
        notes:
          type: string
      required:
        - name
        - industry

    UpdateCompanyBody:
      type: object
      properties:
        name:
          type: string
        industry:
          type: string
        subIndustry:
          type: string
        website:
          type: string
        size:
          type: string
        revenue:
          type: string
        location:
          type: string
        status:
          type: string
        fitScore:
          type: integer
        painPoints:
          type: string
        notes:
          type: string

    Contact:
      type: object
      properties:
        id:
          type: integer
        firstName:
          type: string
        lastName:
          type: string
        email:
          type: ["string", "null"]
        phone:
          type: ["string", "null"]
