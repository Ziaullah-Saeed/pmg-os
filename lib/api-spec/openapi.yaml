components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    DashboardSummary:
      type: object
      properties:
        totalCompanies:
          type: integer
        totalContacts:
          type: integer
        totalLeads:
          type: integer
        totalOpportunities:
          type: integer
        totalPipelineValue:
          type: number
        activeCampaigns:
          type: integer
        pendingTasks:
          type: integer
        recentCommunications:
          type: integer
        leadsByStatus:
          type: object
          additionalProperties:
            type: integer
        opportunitiesByStage:
          type: object
          additionalProperties:
            type: integer
        revenueByMonth:
          type: array
          items:
            $ref: "#/components/schemas/RevenueDataPoint"
      required:
        - totalCompanies
        - totalContacts
        - totalLeads
        - totalOpportunities
        - totalPipelineValue
        - activeCampaigns
        - pendingTasks
        - recentCommunications
        - leadsByStatus
        - opportunitiesByStage
        - revenueByMonth

    RevenueDataPoint:
      type: object
      properties:
        month:
          type: string
        value:
          type: number
      required:
        - month
        - value

    PipelineSummary:
      type: object
      properties:
        stages:
          type: array
          items:
            $ref: "#/components/schemas/PipelineStage"
        totalValue:
          type: number
        totalDeals:
          type: integer
        avgDealSize:
          type: number
        winRate:
          type: number
      required:
        - stages
        - totalValue
        - totalDeals
        - avgDealSize
        - winRate

    PipelineStage:
      type: object
      properties:
        name:
          type: string
        count:
          type: integer
        value:
          type: number
        percentage:
          type: number
      required:
        - name
        - count
        - value
        - percentage

    Company:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        industry:
          type: string
        subIndustry:
          type: ["string", "null"]
        website:
          type: ["string", "null"]
        size:
          type: ["string", "null"]
        revenue:
          type: ["string", "null"]
        location:
          type: ["string", "null"]
        status:
          type: string
        fitScore:
          type: ["integer", "null"]
        painPoints:
          type: ["string", "null"]
        notes:
          type: ["string", "null"]
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
        - id
        - name
        - industry
        - status
        - createdAt
        - updatedAt

    CreateCompanyBody:
      type: object
      properties:
        name:
          type: string
        industry:
          type: string
        subIndustry:
          type: string
        website:
          type: string
        size:
          type: string
        revenue:
          type: string
        location:
          type: string
        status:
          type: string
        fitScore:
          type: integer
        painPoints:
          type: string
        notes:
          type: string
      required:
        - name
        - industry

    UpdateCompanyBody:
      type: object
      properties:
        name:
          type: string
        industry:
          type: string
        subIndustry:
          type: string
        website:
          type: string
        size:
          type: string
        revenue:
          type: string
        location:
          type: string
        status:
          type: string
        fitScore:
          type: integer
        painPoints:
          type: string
        notes:
          type: string

    Contact:
      type: object
      properties:
        id:
          type: integer
        firstName:
          type: string
        lastName:
          type: string
        email:
          type: ["string", "null"]
        phone:
          type: ["string", "null"]
        title:
          type: ["string", "null"]
        role:
          type: ["string", "null"]
        companyId:
          type: ["integer", "null"]
        companyName:
          type: ["string", "null"]
        isDecisionMaker:
          type: boolean
        authorityLevel:
          type: ["string", "null"]
        linkedinUrl:
          type: ["string", "null"]
        status:
          type: string
        notes:
          type: ["string", "null"]
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
        - id
        - firstName
        - lastName
        - isDecisionMaker
        - status
        - createdAt
        - updatedAt

    CreateContactBody:
      type: object
      properties:
        firstName:
          type: string
        lastName:
          type: string
        email:
          type: string
        phone:
          type: string
        title:
          type: string
        role:
          type: string
        companyId:
          type: integer
        isDecisionMaker:
          type: boolean
        authorityLevel:
          type: string
        linkedinUrl:
          type: string
        status:
          type: string
        notes:
          type: string
      required:
        - firstName
        - lastName

    UpdateContactBody:
      type: object
      properties:
        firstName:
          type: string
        lastName:
          type: string
        email:
          type: string
        phone:
          type: string
        title:
          type: string
        role:
          type: string
        companyId:
          type: integer
        isDecisionMaker:
          type: boolean
        authorityLevel:
          type: string
        linkedinUrl:
          type: string
        status:
          type: string
        notes:
          type: string

    Lead:
      type: object
      properties:
        id:
          type: integer
        companyId:
          type: ["integer", "null"]
        companyName:
          type: ["string", "null"]
        contactId:
          type: ["integer", "null"]
        contactName:
          type: ["string", "null"]
        source:
          type: string
        status:
          type: string
        priority:
          type: string
        fitScore:
          type: ["integer", "null"]
        confidenceScore:
          type: ["integer", "null"]
        painPoints:
          type: ["string", "null"]
        bestAngle:
          type: ["string", "null"]
        nextAction:
