openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
  description: PMG Group OS API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: dashboard
    description: Command Center & Executive Control
  - name: companies
    description: Company management
  - name: contacts
    description: Contact management
  - name: leads
    description: Lead & prospecting management
  - name: opportunities
    description: CRM opportunities & deals
  - name: activities
    description: Activity logging
  - name: campaigns
    description: Marketing campaigns
  - name: tasks
    description: Task management
  - name: documents
    description: Document & archive management
  - name: communications
    description: Communication logs

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /dashboard/summary:
    get:
      operationId: getDashboardSummary
      tags: [dashboard]
      summary: Get executive dashboard summary
      responses:
        "200":
