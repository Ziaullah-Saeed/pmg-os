kind = "video"
previewPath = "/pmg-walkthrough/"
title = "PMG OS Complete Walkthrough"
version = "1.0.0"
id = "artifacts/pmg-walkthrough"
router = "path"

[[integratedSkills]]
name = "video-js"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/pmg-walkthrough/" ]
localPort = 20896

[services.development]
run = "pnpm --filter @workspace/pmg-walkthrough run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/pmg-walkthrough", "run", "build" ]
publicDir = "artifacts/pmg-walkthrough/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20896"
BASE_PATH = "/pmg-walkthrough/"
