# =============================================================================
# PMG Group OS — frontend nginx config (single-origin Docker deploy)
# =============================================================================
# Serves the static Vite build and reverse-proxies /api to the API container,
# so the browser sees ONE origin:
#   - no CORS needed (frontend + API are same-origin)
#   - session cookies work over plain HTTP (the API uses SameSite=Lax / non-Secure)
# The React app calls the relative "/api" path (VITE_API_BASE_URL is left unset
# at build time), which nginx forwards to the `api` service below.
# -----------------------------------------------------------------------------

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Generous body limit for CSV imports / transcript payloads.
    client_max_body_size 25m;

    # --- API reverse proxy ---------------------------------------------------
    # No URI part on proxy_pass, so the full "/api/..." path is forwarded
    # unchanged to Express (which mounts every route under /api via app.use("/api")).
    # `api` resolves over the compose network; depends_on guarantees it is up.
    location /api/ {
        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket upgrade (websocket-service.ts runs on the same HTTP port).
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # AI endpoints can stream / run long. Disable buffering and use a long
        # read timeout so chunks flush immediately and generations aren't cut off.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # --- SPA fallback --------------------------------------------------------
    # Client-side routing (wouter): unknown paths return index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
