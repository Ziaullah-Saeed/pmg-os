kind = "web"
previewPath = "/"
title = "PMG Group OS"
version = "1.0.0"
id = "artifacts/pmg-os"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 20788

[services.development]
run = "pnpm --filter @workspace/pmg-os run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/pmg-os", "run", "build" ]
publicDir = "artifacts/pmg-os/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20788"
BASE_PATH = "/"
